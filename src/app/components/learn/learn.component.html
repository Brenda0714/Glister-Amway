<div>

    <img src="assets/img/Aprende/ImagenArriba.jpg" draggable="false" style="width: 100%;" alt="">

    <div class="custom-container overflow">

        <span class="g-title text-center pt4 mb2">SELECCIONA LOS DOCUMENTOS QUE DESEAS DESCARGAR</span>

        <div class="accordion mb4" id="accordionFlus">
            <div *ngFor="let learn of learnings" class="accordion-item">
                <h2 class="accordion-header pt1 pb1">
                    <button class="accordion-button collapsed" (click)="collapse('flush-collapse-' + learn.id)" type="button" data-bs-toggle="show" [attr.data-bs-target]="'#flush-collapse-' + learn.id" aria-expanded="false" >
                        <img [src]="learn.icon" style="width: 25px; margin-right: 1rem;" draggable="false" alt=""> <span class="g-text">{{ learn.title }}</span>
                    </button>
                </h2>
                <div [id]="'flush-collapse-' + learn.id" class="accordion-collapse collapse" >
                    <div class="accordion-body pt2 pb2">

                        <div class="row mb1" *ngFor="let resourse of learn.resources">
                            <div class="col-sm-6 col-md-6 col-lg-2" style="display: flex; align-items: center;">
                                <img [src]="resourse.img" style="width: 100%; max-height: 140px; object-fit: cover;" draggable="false" alt="">
                            </div>
                            <div class="col-sm-6 col-md-6 col-lg-5" style="display: flex; align-items: center; justify-content: center;">
                                <span class="g-text text-center">{{ resourse.name }}</span>
                            </div>
                            <div class="col-sm-6 col-md-6 col-lg-2" style="display: flex; align-items: center; justify-content: center;">
                                <span class="g-text">{{ resourse.size }}</span>
                            </div>
                            <div class="col-sm-6 col-md-6 col-lg-3" style="display: flex; align-items: center; justify-content: center;">
                                <span (click)="donwload(resourse.link)" class="g-text-small g-bold" style="cursor: pointer; color: #212529;">DESCARGAR ARCHIVO</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <img src="assets/img/Mentas PNG/Menta-04.png" class="mint" style="top: 0%; left: -3%; transform: rotate(-25deg);" draggable="false" alt="">
        <img src="assets/img/Mentas PNG/Menta-03.png" class="mint" style="top: 80%; right: -4%; transform: rotate(-55deg);" draggable="false" alt="">
    </div>
  
</div>
