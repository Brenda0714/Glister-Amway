<div>

    <img src="assets/img/Compras/ImagenArriba.jpg" draggable="false" style="width: 100%;" alt="">


    <div class="custom-container mt4">
        <span class="g-text-small mb2 text-center">*Por la legislación regulatoria el sello Plant-Based Goodness™ en Chile no aplica.</span>
        <span class="g-title mb4 text-center">Selecciona la bandera de tu país para comenzar tu compra</span>

        <div class="custom-center">
            <div class="row custom-row pb4">
                <div *ngFor="let country of countries" class="col-12 col-md-4 col-lg-3 text-center">
                    <img [src]="country.img" (click)="openLink(country.link)" draggable="false" class="country-img" alt="">
                </div>
            </div>
        </div>

    </div>
</div>
